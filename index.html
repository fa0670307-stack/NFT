<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Маркет NFT · Выбор подарка</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0e0e11; color: #ffffff; padding: 14px 14px 135px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .header h2 { font-size: 19px; font-weight: 700; }
    .header-badge { font-size: 11px; font-weight: 600; color: #64b5f6; background: rgba(51, 144, 236, 0.16); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(51, 144, 236, 0.3); }
    .search-box { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: #18181d; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; }
    .search-box:focus { border-color: #3390ec; }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { padding: 7px 13px; border-radius: 20px; background: #18181d; color: #fff; font-size: 13px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; align-items: center; gap: 7px; }
    .chip.active { border-color: #3390ec; background: rgba(51, 144, 236, 0.25); }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
    .nft-card { background: #18181d; border-radius: 20px; padding: 8px; border: 2px solid transparent; cursor: pointer; transition: 0.15s; }
    .nft-card.selected { border-color: #3390ec; background: #202028; box-shadow: 0 8px 24px rgba(51, 144, 236, 0.25); }
    .nft-stage { aspect-ratio: 1 / 1; border-radius: 15px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .nft-pattern { position: absolute; inset: 0; opacity: 0.26; background-size: 68px 68px; pointer-events: none; z-index: 1; }
    .nft-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; border-radius: 15px; transition: transform 0.3s ease; }
    .nft-card.selected .nft-img { transform: scale(1.06); }
    .rarity-tag { position: absolute; top: 7px; right: 7px; z-index: 3; background: rgba(0, 0, 0, 0.52); backdrop-filter: blur(6px); padding: 3px 7px; border-radius: 8px; font-size: 10px; font-weight: 700; color: #fff; }
    .nft-title { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .nft-meta { font-size: 11.5px; color: #8e8e93; display: flex; justify-content: space-between; }
    .custom-box { margin-top: 16px; background: #18181d; padding: 13px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); }
    .custom-box label { font-size: 12.5px; color: #8e8e93; display: block; margin-bottom: 8px; }
    .custom-preview { display: none; align-items: center; gap: 12px; margin-top: 10px; padding: 10px; background: #202029; border-radius: 14px; border: 1px solid #3390ec; }
    .custom-preview img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: #2b7a38; }
    .bottom-dock { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: rgba(20, 20, 26, 0.97); backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,0.12); padding: 12px 14px 20px; z-index: 99999; }
    .dock-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .dock-thumb { width: 42px; height: 42px; border-radius: 11px; overflow: hidden; background: #2b7a38; flex-shrink: 0; }
    .dock-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .dock-title { font-size: 14px; font-weight: 700; }
    .dock-sub { font-size: 12px; color: #8e8e93; }
    .confirm-btn { display: block; width: 100%; background: linear-gradient(135deg, #3390ec, #2575fc); color: #fff; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Выберите NFT для сделки</h2>
    <span class="header-badge">Telegram Gifts</span>
  </div>

  <input id="search" class="search-box" type="text" placeholder="Поиск: Pepe, Cap, Ring, #2325..." oninput="renderGrid()" />
  <div class="filters" id="colorFilters"></div>
  <div class="grid" id="nftGrid"></div>

  <div class="custom-box">
    <label>Или вставьте ссылку на ваш подарок (t.me/nft/...):</label>
    <input id="customLink" class="search-box" style="margin-bottom:0" type="text" placeholder="https://t.me" oninput="onCustomInput()" />
    <div id="customPreview" class="custom-preview">
      <img id="customPreviewImg" src="" alt="" />
      <div>
        <div id="customPreviewTitle" class="nft-title"></div>
        <div class="nft-meta">Коллекционный подарок Telegram</div>
      </div>
    </div>
  </div>

  <div id="bottomDock" class="bottom-dock">
    <div class="dock-info">
      <div class="dock-thumb"><img id="dockImg" src="" alt="" /></div>
      <div>
        <div class="dock-title" id="dockTitle"></div>
        <div class="dock-sub" id="dockSub"></div>
      </div>
    </div>
    <button id="confirmBtn" class="confirm-btn" type="button" onclick="confirmSelection()">Подтвердить выбор</button>
  </div>
  <script>
    var BOT_USERNAME = "nfl_trading_bot";

    var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    var PATTERNS = {
      pills: "url(\"data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='68' height='68' viewBox='0 0 68 68'%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='2.2'%3E%3Crect x='10' y='12' width='18' height='9' rx='4.5' transform='rotate(-35 19 16.5)'/%3E%3Cline x1='16' y1='13' x2='22' y2='20'/%3E%3Crect x='42' y='44' width='18' height='9' rx='4.5' transform='rotate(25 51 48.5)'/%3E%3Cline x1='49' y1='44' x2='53' y2='53'/%3E%3C/g%3E%3C/svg%3E\")",
      stars: "url(\"data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='64' height='64' viewBox='0 0 64 64'%3E%3Cpath d='M16 8l2.2 5.8L24 16l-5.8 2.2L16 24l-2.2-5.8L8 16l5.8-2.2zM48 38l1.8 4.2L54 44l-4.2 1.8L48 50l-1.8-4.2L42 44l4.2-1.8z' fill='%23ffffff'/%3E%3C/svg%3E\")"
    };

    var COLORS = [
      { id: "all", name: "Все", hex: "#8e8e93" },
      { id: "Emerald", name: "Emerald", hex: "#2ea858" },
      { id: "Onyx Black", name: "Onyx Black", hex: "#383842" },
      { id: "Midnight Blue", name: "Midnight Blue", hex: "#2868c7" },
      { id: "Mystic Purple", name: "Mystic Purple", hex: "#8542c9" },
      { id: "Pure Gold", name: "Pure Gold", hex: "#d9a21b" },
      { id: "Crimson", name: "Crimson", hex: "#c9303e" }
    ];

    var NFTS = [
      { slug: "plushpepe-2325", gift: "Plush Pepe", model: "Clown", title: "Plush Pepe #2325", color: "Emerald", rarity: "0.5%", bg: "radial-gradient(circle, #5dc460, #2b7a38)", pattern: PATTERNS.pills },
      { slug: "plushpepe-1", gift: "Plush Pepe", model: "Original", title: "Plush Pepe #1", color: "Emerald", rarity: "1.2%", bg: "radial-gradient(circle, #38b87c, #145c3b)", pattern: PATTERNS.stars },
      { slug: "durovscap-1", gift: "Durov's Cap", model: "Original", title: "Durov's Cap #1", color: "Onyx Black", rarity: "0.8%", bg: "radial-gradient(circle, #484856, #18181f)", pattern: PATTERNS.stars },
      { slug: "signetring-1", gift: "Signet Ring", model: "Original", title: "Signet Ring #1", color: "Pure Gold", rarity: "1.0%", bg: "radial-gradient(circle, #e6b422, #755204)", pattern: PATTERNS.stars },
      { slug: "scaredcat-1", gift: "Scared Cat", model: "Original", title: "Scared Cat #1", color: "Mystic Purple", rarity: "1.5%", bg: "radial-gradient(circle, #904cd6, #3b1661)", pattern: PATTERNS.stars },
      { slug: "swisswatch-1", gift: "Swiss Watch", model: "Original", title: "Swiss Watch #1", color: "Midnight Blue", rarity: "1.1%", bg: "radial-gradient(circle, #3772d1, #112954)", pattern: PATTERNS.stars },
      { slug: "astralshard-1", gift: "Astral Shard", model: "Original", title: "Astral Shard #1", color: "Crimson", rarity: "0.7%", bg: "radial-gradient(circle, #db3d4b, #631018)", pattern: PATTERNS.stars },
      { slug: "toybear-1", gift: "Toy Bear", model: "Original", title: "Toy Bear #1", color: "Pure Gold", rarity: "1.8%", bg: "radial-gradient(circle, #de9e38, #6e460a)", pattern: PATTERNS.pills },
      { slug: "lootbag-1", gift: "Loot Bag", model: "Original", title: "Loot Bag #1", color: "Onyx Black", rarity: "0.9%", bg: "radial-gradient(circle, #515161, #1c1c24)", pattern: PATTERNS.stars },
      { slug: "iongem-1", gift: "Ion Gem", model: "Original", title: "Ion Gem #1", color: "Midnight Blue", rarity: "1.3%", bg: "radial-gradient(circle, #2ba4db, #0d4563)", pattern: PATTERNS.stars }
    ];

    var activeColor = "all";
    var selectedNft = null;

    function getImgUrl(slug) {
      return "https://fragment.com" + slug.toLowerCase() + ".large.jpg";
    }

    window.onImgErr = function(img, slug) {
      var step = img.getAttribute("data-step") || "0";
      if (step === "0") {
        img.setAttribute("data-step", "1");
        img.src = "https://fragment.com" + slug.toLowerCase() + ".medium.jpg";
      } else if (step === "1") {
        img.setAttribute("data-step", "2");
        img.src = "https://fragment.com" + slug.toLowerCase() + ".webp";
      } else {
        img.style.display = "none";
      }
    };
    function parseCustomLink(raw) {
      var val = raw.trim();
      if (!val) return null;
      var m = val.match(/t\.me\/nft\/([a-zA-Z0-9_-]+)/i);
      if (m) {
        var slug = m.at(1).toLowerCase();
        var parts = slug.split("-");
        var num = parts.length > 1 ? parts.pop() : "";
        var name = parts.join(" ");
        name = name.charAt(0).toUpperCase() + name.slice(1);
        return { title: num ? (name + " #" + num) : name, slug: slug, model: "Original" };
      }
      return { title: val, slug: "", model: "" };
    }

    function renderFilters() {
      var box = document.getElementById("colorFilters");
      box.innerHTML = "";
      COLORS.forEach(function(c) {
        var el = document.createElement("div");
        el.className = "chip" + (activeColor === c.id ? " active" : "");
        el.innerHTML = '<span class="dot" style="background:' + c.hex + '"></span>' + c.name;
        el.onclick = function() { activeColor = c.id; renderFilters(); renderGrid(); };
        box.appendChild(el);
      });
    }

    function renderGrid() {
      var q = document.getElementById("search").value.toLowerCase().trim();
      var grid = document.getElementById("nftGrid");
      grid.innerHTML = "";

      NFTS.forEach(function(item) {
        if (activeColor !== "all" && item.color !== activeColor) return;
        if (q && item.title.toLowerCase().indexOf(q) === -1 && item.color.toLowerCase().indexOf(q) === -1) return;

        var isSel = selectedNft && selectedNft.slug === item.slug;
        var card = document.createElement("div");
        card.className = "nft-card" + (isSel ? " selected" : "");
        card.innerHTML =
          '<div class="nft-stage" style="background:' + item.bg + '">' +
            '<div class="nft-pattern" style="background-image:' + item.pattern + '"></div>' +
            '<span class="rarity-tag">' + item.rarity + '</span>' +
            '<img class="nft-img" src="' + getImgUrl(item.slug) + '" data-step="0" onerror="onImgErr(this, \'' + item.slug + '\')" />' +
          '</div>' +
          '<div class="nft-title">' + item.title + '</div>' +
          '<div class="nft-meta"><span>' + item.model + '</span><span>' + item.color + '</span></div>';

        card.onclick = function() {
          selectedNft = item;
          document.getElementById("customLink").value = "";
          document.getElementById("customPreview").style.display = "none";
          renderGrid();
          updateDock();
        };
        grid.appendChild(card);
      });
    }

    function onCustomInput() {
      var parsed = parseCustomLink(document.getElementById("customLink").value);
      var box = document.getElementById("customPreview");
      if (parsed) {
        selectedNft = null;
        renderGrid();
        document.getElementById("customPreviewTitle").textContent = parsed.title;
        var img = document.getElementById("customPreviewImg");
        if (parsed.slug) {
          img.setAttribute("data-step", "0");
          img.onerror = function() { onImgErr(img, parsed.slug); };
          img.src = getImgUrl(parsed.slug);
          img.style.display = "block";
        } else {
          img.style.display = "none";
        }
        box.style.display = "flex";
      } else {
        box.style.display = "none";
      }
      updateDock();
    }

    function updateDock() {
      var custom = parseCustomLink(document.getElementById("customLink").value);
      var active = custom ? custom : selectedNft;
      var dock = document.getElementById("bottomDock");
      if (!active) { dock.style.display = "none"; return; }

      dock.style.display = "block";
      document.getElementById("dockTitle").textContent = active.title;
      document.getElementById("dockSub").textContent = "Нажмите для перехода к выбору валюты";
      document.getElementById("confirmBtn").textContent = "Выбрать: " + active.title;

      var img = document.getElementById("dockImg");
      if (active.slug) {
        img.src = getImgUrl(active.slug);
        img.style.display = "block";
      } else {
        img.style.display = "none";
      }
    }

    function confirmSelection() {
      var custom = parseCustomLink(document.getElementById("customLink").value);
      var chosen = custom ? custom : selectedNft;
      if (!chosen) return;

      var slugForUrl = chosen.slug || chosen.title.replace(/[^a-zA-Z0-9_-]/g, "_");
      var deepLink = "https://t.me" + BOT_USERNAME + "?start=nft_" + encodeURIComponent(slugForUrl);
      var payload = JSON.stringify({ title: chosen.title, slug: chosen.slug || "" });

      if (tg && typeof tg.sendData === "function") {
        try { tg.sendData(payload); } catch (e) {}
      }

      setTimeout(function() {
        if (tg && typeof tg.openTelegramLink === "function") {
          try { tg.openTelegramLink(deepLink); } catch (e) {}
        }
      }, 150);

      setTimeout(function() {
        if (tg && typeof tg.close === "function") {
          try { tg.close(); } catch (e) {}
        } else {
          window.top.location.href = deepLink;
        }
      }, 450);

      var dock = document.getElementById("bottomDock");
      dock.innerHTML =
        '<a href="' + deepLink + '" class="confirm-btn" style="background:#2ea858;">' +
        'Открыть бота (' + chosen.title + ')</a>';
    }

    renderFilters();
    renderGrid();
  </script>
</body>
</html>
