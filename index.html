<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Выбор NFT</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f0f12; color: #ffffff; padding: 14px; padding-bottom: 115px; }
    h2 { font-size: 18px; margin-bottom: 12px; font-weight: 700; }
    .search-box {
      width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12);
      background: #1a1a20; color: #ffffff; font-size: 14px; margin-bottom: 12px; outline: none;
    }
    .search-box:focus { border-color: #3390ec; }
    .colors { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; scrollbar-width: none; }
    .colors::-webkit-scrollbar { display: none; }
    .chip {
      padding: 7px 13px; border-radius: 20px; background: #1a1a20; color: #ffffff;
      font-size: 13px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .chip.active { border-color: #3390ec; background: rgba(51, 144, 236, 0.25); }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .nft-card {
      background: #1a1a20; border-radius: 18px; padding: 9px; border: 2px solid transparent;
      cursor: pointer; transition: 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .nft-card.selected { border-color: #3390ec; background: #22222c; }
    .nft-preview {
      aspect-ratio: 1 / 1; border-radius: 13px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px; position: relative; overflow: hidden; background: #25252e;
    }
    .nft-preview img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 13px; z-index: 1;
    }
    .nft-badge {
      position: absolute; top: 7px; right: 7px; z-index: 2; background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px); padding: 3px 8px; border-radius: 8px; font-size: 11px; color: #fff; font-weight: 600;
    }
    .nft-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nft-sub { font-size: 12px; color: #8e8e93; }
    .custom-box { margin-top: 16px; background: #1a1a20; padding: 12px; border-radius: 16px; }
    .custom-box label { font-size: 13px; color: #8e8e93; display: block; margin-bottom: 8px; }
    .custom-preview {
      display: none; align-items: center; gap: 12px; margin-top: 10px;
      padding: 10px; background: #22222c; border-radius: 12px; border: 1px solid #3390ec;
    }
    .custom-preview img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #141418; }
    .confirm-bar {
      display: none; position: fixed; left: 0; right: 0; bottom: 0;
      padding: 12px 14px 20px; background: rgba(15, 15, 18, 0.97);
      border-top: 1px solid rgba(255,255,255,0.12); z-index: 9999;
    }
    .confirm-btn {
      display: block; width: 100%; background: #3390ec; color: #ffffff; border: none;
      text-align: center; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .confirm-btn:active { opacity: 0.85; }
  </style>
</head>
<body>
  <h2>Выберите NFT для сделки</h2>
  <input id="search" class="search-box" type="text" placeholder="Поиск по коллекции или номеру..." />
  <div class="colors" id="colorFilters"></div>
  <div class="grid" id="nftGrid"></div>

  <div class="custom-box">
    <label>Или вставьте ссылку на ваш NFT (t.me/nft/...):</label>
    <input id="customLink" class="search-box" style="margin-bottom:0" type="text" placeholder="https://t.me" />
    <div id="customPreview" class="custom-preview">
      <img id="customPreviewImg" src="" alt="" />
      <div>
        <div id="customPreviewTitle" class="nft-name"></div>
        <div class="nft-sub">Оригинальный NFT Telegram</div>
      </div>
    </div>
  </div>

  <div id="confirmBar" class="confirm-bar">
    <button id="confirmBtn" class="confirm-btn" type="button">Подтвердить выбор</button>
  </div>
  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var BOT_USERNAME = urlParams.get("bot") || "";

    var COLORS = [
      { id: "all", name: "Все цвета", hex: "#888888" },
      { id: "Emerald", name: "Emerald", hex: "#1b6b4a" },
      { id: "Onyx Black", name: "Onyx Black", hex: "#2c2c2e" },
      { id: "Midnight Blue", name: "Midnight Blue", hex: "#1b3b6f" },
      { id: "Mystic Purple", name: "Mystic Purple", hex: "#6f35a3" },
      { id: "Pure Gold", name: "Pure Gold", hex: "#c99716" },
      { id: "Crimson", name: "Crimson", hex: "#a8272e" }
    ];

    var NFTS = [
      { slug: "plushpepe-1", title: "Plush Pepe #1", color: "Emerald" },
      { slug: "plushpepe-2325", title: "Plush Pepe #2325", color: "Midnight Blue" },
      { slug: "durovscap-1", title: "Durov's Cap #1", color: "Onyx Black" },
      { slug: "signetring-1", title: "Signet Ring #1", color: "Pure Gold" },
      { slug: "scaredcat-1", title: "Scared Cat #1", color: "Mystic Purple" },
      { slug: "swisswatch-1", title: "Swiss Watch #1", color: "Midnight Blue" },
      { slug: "astralshard-1", title: "Astral Shard #1", color: "Crimson" },
      { slug: "toybear-1", title: "Toy Bear #1", color: "Pure Gold" },
      { slug: "lootbag-1", title: "Loot Bag #1", color: "Onyx Black" },
      { slug: "iongem-1", title: "Ion Gem #1", color: "Midnight Blue" },
      { slug: "voodoodoll-1", title: "Voodoo Doll #1", color: "Mystic Purple" },
      { slug: "eternalrose-1", title: "Eternal Rose #1", color: "Crimson" }
    ];

    var activeColor = "all";
    var selectedNft = null;
    var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    window.handleImgError = function(img, slug) {
      var step = parseInt(img.getAttribute("data-step") || "0", 10);
      if (step === 0) {
        img.setAttribute("data-step", "1");
        img.src = "https://fragment.com" + slug + ".medium.jpg";
      } else if (step === 1) {
        img.setAttribute("data-step", "2");
        img.src = "https://fragment.com" + slug + ".webp";
      } else {
        img.onerror = null;
      }
    };

    function getImgUrl(slug) {
      return "https://fragment.com" + slug.toLowerCase() + ".large.jpg";
    }

    function parseCustomInput(raw) {
      var val = raw.trim();
      if (!val) return null;
      var match = val.match(/t\.me\/nft\/([a-zA-Z0-9_-]+)/i);
      if (match && match[1]) {
        var slug = match[1].toLowerCase();
        var parts = slug.split("-");
        var num = parts.length > 1 ? parts.pop() : "";
        var name = parts.join(" ").replace(/([a-z])([A-Z])/g, "$1 $2");
        name = name.charAt(0).toUpperCase() + name.slice(1);
        var title = num ? (name + " #" + num) : name;
        return { title: title, slug: slug };
      }
      return { title: val, slug: "" };
    }
    function renderColors() {
      var container = document.getElementById("colorFilters");
      container.innerHTML = "";
      COLORS.forEach(function(c) {
        var chip = document.createElement("div");
        chip.className = "chip" + (activeColor === c.id ? " active" : "");
        chip.innerHTML = '<span class="dot" style="background:' + c.hex + '"></span>' + c.name;
        chip.onclick = function() {
          activeColor = c.id;
          renderColors();
          renderGrid();
        };
        container.appendChild(chip);
      });
    }

    function renderGrid() {
      var query = document.getElementById("search").value.toLowerCase().trim();
      var grid = document.getElementById("nftGrid");
      grid.innerHTML = "";

      NFTS.forEach(function(item) {
        if (activeColor !== "all" && item.color !== activeColor) return;
        if (query && item.title.toLowerCase().indexOf(query) === -1 && item.color.toLowerCase().indexOf(query) === -1) return;

        var isSelected = selectedNft && selectedNft.slug === item.slug;
        var card = document.createElement("div");
        card.className = "nft-card" + (isSelected ? " selected" : "");
        card.innerHTML =
          '<div class="nft-preview">' +
            '<span class="nft-badge">NFT</span>' +
            '<img src="' + getImgUrl(item.slug) + '" alt="' + item.title + '" data-step="0" onerror="handleImgError(this, \'' + item.slug + '\')" />' +
          '</div>' +
          '<div class="nft-name">' + item.title + '</div>' +
          '<div class="nft-sub">' + item.color + '</div>';

        card.onclick = function() {
          selectedNft = item;
          document.getElementById("customLink").value = "";
          document.getElementById("customPreview").style.display = "none";
          renderGrid();
          updateConfirmBar();
        };
        grid.appendChild(card);
      });
    }

    function updateConfirmBar() {
      var customParsed = parseCustomInput(document.getElementById("customLink").value);
      var bar = document.getElementById("confirmBar");
      var btn = document.getElementById("confirmBtn");

      if (customParsed) {
        bar.style.display = "block";
        btn.textContent = "Подтвердить: " + customParsed.title;
      } else if (selectedNft) {
        bar.style.display = "block";
        btn.textContent = "Подтвердить: " + selectedNft.title;
      } else {
        bar.style.display = "none";
      }
    }

    document.getElementById("search").addEventListener("input", renderGrid);

    document.getElementById("customLink").addEventListener("input", function() {
      var parsed = parseCustomInput(this.value);
      var previewBox = document.getElementById("customPreview");
      if (parsed) {
        selectedNft = null;
        renderGrid();
        document.getElementById("customPreviewTitle").textContent = parsed.title;
        var img = document.getElementById("customPreviewImg");
        if (parsed.slug) {
          img.setAttribute("data-step", "0");
          img.onerror = function() { handleImgError(img, parsed.slug); };
          img.src = getImgUrl(parsed.slug);
          img.style.display = "block";
        } else {
          img.style.display = "none";
        }
        previewBox.style.display = "flex";
      } else {
        previewBox.style.display = "none";
      }
      updateConfirmBar();
    });

    function submitChoice() {
      var customParsed = parseCustomInput(document.getElementById("customLink").value);
      var chosen = customParsed ? customParsed : selectedNft;
      if (!chosen) return;

      var payload = JSON.stringify({
        title: chosen.title,
        slug: chosen.slug || ""
      });

      var slugForUrl = chosen.slug || chosen.title.replace(/[^a-zA-Z0-9_-]/g, "_");
      var fallbackUrl = BOT_USERNAME
        ? ("https://t.me" + BOT_USERNAME + "?start=nft_" + encodeURIComponent(slugForUrl))
        : "";

      if (tg && typeof tg.sendData === "function") {
        try {
          tg.sendData(payload);
        } catch (e) {}
      }

      if (fallbackUrl) {
        setTimeout(function() {
          if (tg && typeof tg.openTelegramLink === "function") {
            tg.openTelegramLink(fallbackUrl);
            tg.close();
          } else {
            window.location.href = fallbackUrl;
          }
        }, 350);
      }
    }

    document.getElementById("confirmBtn").addEventListener("click", submitChoice);

    renderColors();
    renderGrid();
  </script>
</body>
</html>
